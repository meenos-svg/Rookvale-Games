name: Unit Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle testDebugUnitTest --continue --stacktrace

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          failures = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              suite = ET.parse(path).getroot()
              total += int(suite.get("tests", 0))
              skipped += int(suite.get("skipped", 0))
              for case in suite.iter("testcase"):
                  bad = case.find("failure") if case.find("failure") is not None else case.find("error")
                  if bad is not None:
                      failed += 1
                      msg = (bad.get("message") or "").strip().splitlines()[0:1]
                      failures.append(f"- **{case.get('classname','').split('.')[-1]}.{case.get('name')}**: {msg[0][:200] if msg else ''}")
          print(f"## Unit tests: {total - failed - skipped} passed, {failed} failed, {skipped} skipped\n")
          print("\n".join(failures) if failures else "All tests passed.")
          EOF

      - name: Print failure details
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  bad = case.find("failure") if case.find("failure") is not None else case.find("error")
                  if bad is None:
                      continue
                  print(f"===== {case.get('classname')}.{case.get('name')}")
                  lines = (bad.text or bad.get("message") or "").splitlines()
                  keep = [l for l in lines if "com.example" in l or not l.startswith("\tat ")]
                  print("\n".join(keep[:25]))
          EOF

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
