name: Build & Release Rookvale APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Supabase Secrets (.env)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            {
              echo "SUPABASE_URL=${SUPABASE_URL:-https://wzwuflkwzistgwifsbul.supabase.co}"
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            } > .env
            echo "Configured .env from GitHub Secrets for live co-op builds."
          else
            echo "SUPABASE_ANON_KEY secret not set; APK will build with Offline Solo fallback."
          fi

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Rename APK for easy download
        run: cp app/build/outputs/apk/debug/app-debug.apk Rookvale-latest.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-build
          name: Rookvale Latest Android Build
          body: |
            Automated Android APK build from latest main push.
            Tap **Rookvale-latest.apk** below to download and install on Android.
          files: Rookvale-latest.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
